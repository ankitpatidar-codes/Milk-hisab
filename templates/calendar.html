{% extends "base.html" %}
{% block title %}Calendar - Milk Hisab{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-calendar3"></i> Monthly Calendar</h4>
    <button class="btn btn-primary" onclick="openEntryModal()">
        <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Entry</span>
    </button>
</div>

<!-- Month Navigation -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body p-2 p-md-3">
        <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-outline-primary btn-sm" id="prevMonth">
                <i class="bi bi-chevron-left"></i>
            </button>
            <h5 class="mb-0 fw-bold" id="currentMonth">Loading...</h5>
            <button class="btn btn-outline-primary btn-sm" id="nextMonth">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- Calendar Grid -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body p-2 p-md-3">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<!-- Monthly Summary -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white">
        <h6 class="mb-0"><i class="bi bi-clipboard-data"></i> Monthly Summary</h6>
    </div>
    <div class="card-body" id="monthlySummary">
        <p class="text-muted text-center">Loading...</p>
    </div>
</div>

<!-- Legend -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-3">
        <div class="d-flex flex-wrap gap-3 justify-content-center">
            <span><span class="legend-dot bg-success"></span> Milk Received</span>
            <span><span class="legend-dot bg-danger"></span> Milk Not Received</span>
            <span><span class="legend-dot bg-secondary"></span> No Entry</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var initialYear = {{ year }};
    var initialMonth = {{ month }};
</script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
