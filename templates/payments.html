{% extends "base.html" %}
{% block title %}Payments - Milk Hisab{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-wallet2"></i> Payments</h4>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#paymentModal">
        <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Payment</span>
    </button>
</div>

<!-- Month Selector -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body p-2 p-md-3">
        <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-outline-primary btn-sm" id="prevPayMonth">
                <i class="bi bi-chevron-left"></i>
            </button>
            <h5 class="mb-0 fw-bold" id="paymentMonth">Loading...</h5>
            <button class="btn btn-outline-primary btn-sm" id="nextPayMonth">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- Billing Summary -->
<div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center p-3">
                <div class="text-primary fw-bold fs-5" id="payTotalBill">&#8377;0</div>
                <small class="text-muted">Month's Bill</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center p-3">
                <div class="text-info fw-bold fs-5" id="payCarryForward">&#8377;0</div>
                <small class="text-muted">Carry Forward</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center p-3">
                <div class="text-success fw-bold fs-5" id="payTotalPaid">&#8377;0</div>
                <small class="text-muted">Total Paid</small>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center p-3">
                <div class="text-danger fw-bold fs-5" id="payPending">&#8377;0</div>
                <small class="text-muted">Pending</small>
            </div>
        </div>
    </div>
</div>

<!-- Payment List -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white">
        <h6 class="mb-0">Payment History</h6>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Notes</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="paymentsList">
                    <tr><td colspan="4" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi bi-wallet2"></i> Add Payment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="paymentForm">
                    <div class="mb-3">
                        <label for="paymentDate" class="form-label fw-bold">Payment Date</label>
                        <input type="date" class="form-control form-control-lg" id="paymentDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="paymentAmount" class="form-label fw-bold">Amount (&#8377;)</label>
                        <input type="number" class="form-control form-control-lg" id="paymentAmount" step="1" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="paymentNotes" class="form-label fw-bold">Notes (Optional)</label>
                        <input type="text" class="form-control" id="paymentNotes" placeholder="e.g., Cash, UPI, etc.">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success btn-lg" id="savePayment">
                    <i class="bi bi-check-lg"></i> Save Payment
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/payments.js') }}"></script>
{% endblock %}
